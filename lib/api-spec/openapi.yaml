openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: text-to-bpmn
    description: Generate BPMN process graphs and implementation specifications
  - name: admin
    description: Whitelisted administrator dashboard and user management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /generate:
    post:
      operationId: generateBpmn
      tags: [text-to-bpmn]
      summary: Generate a BPMN graph from a process description
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BpmnGenerateInput"
      responses:
        "200":
          description: Generated process graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BpmnGenerateResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The AI provider returned an error or invalid graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI provider credentials are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bpmn/generate:
    post:
      operationId: generateBpmnXml
      tags: [text-to-bpmn]
      summary: Generate a BPMN 2.0 XML document through OpenRouter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BpmnXmlGenerateInput"
      responses:
        "200":
          description: Raw BPMN 2.0 XML
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/BpmnXmlGenerateResponse"
        "400":
          description: Invalid prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Google sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Free generation limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The model returned invalid BPMN XML
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: OpenRouter is unavailable or credentials are missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      operationId: getAuthStatus
      tags: [health]
      summary: Return the current signed-in user and quota status
      responses:
        "200":
          description: Current authentication status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
  /auth/logout:
    post:
      operationId: logoutUser
      tags: [health]
      summary: End the current login session
      responses:
        "204":
          description: Session ended
  /upload-document:
    post:
      operationId: uploadDocument
      tags: [text-to-bpmn]
      summary: Extract a process description from a document and generate its BPMN graph
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DocumentUploadInput"
      responses:
        "200":
          description: Extracted description and generated process graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentUploadResponse"
        "400":
          description: Unsupported, empty, or unreadable document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Document exceeds the upload size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The AI provider returned an error or invalid graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI provider credentials are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /refine:
    post:
      operationId: refineBpmn
      tags: [text-to-bpmn]
      summary: Apply a clarification to an existing BPMN graph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BpmnRefineInput"
      responses:
        "200":
          description: Updated process graph and validator response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BpmnRefineResponse"
        "400":
          description: Invalid request or incompatible graph update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The clarification did not change the graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The AI provider returned an error or invalid graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI provider credentials are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /generate-spec:
    post:
      operationId: generateSpec
      tags: [text-to-bpmn]
      summary: Generate a technical specification from a BPMN graph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BpmnSpecInput"
      responses:
        "200":
          description: Generated technical specification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BpmnSpecResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The AI provider returned an error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI provider credentials are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get administrator dashboard statistics
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatsResponse"
        "401":
          description: Authentication required
        "403":
          description: Whitelisted administrator access required
        "500":
          description: Statistics could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: List users for administrators
      parameters:
        - in: query
          name: email
          required: false
          schema:
            type: string
            maxLength: 255
          description: Filter users by email substring
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"
        "401":
          description: Authentication required
        "403":
          description: Whitelisted administrator access required
        "500":
          description: Users could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{id}/toggle-whitelist:
    post:
      operationId: toggleAdminUserWhitelist
      tags: [admin]
      summary: Toggle a user's whitelist status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
        "400":
          description: Invalid user ID
        "401":
          description: Authentication required
        "403":
          description: Whitelisted administrator access required
        "404":
          description: User not found
        "500":
          description: User could not be updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{id}/grant-premium:
    post:
      operationId: grantAdminUserPremium
      tags: [admin]
      summary: Grant or extend a 30-day premium subscription
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
        "400":
          description: Invalid user ID
        "401":
          description: Authentication required
        "403":
          description: Whitelisted administrator access required
        "404":
          description: User not found
        "500":
          description: User could not be updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/production-snapshot:
    get:
      operationId: getAdminProductionSnapshot
      tags: [admin]
      summary: Read production dashboard data through the administrator API
      parameters:
        - in: query
          name: email
          required: false
          schema:
            type: string
            maxLength: 255
          description: Filter production users by email substring
      responses:
        "200":
          description: Read-only production snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSnapshotResponse"
        "401":
          description: Authentication required
        "403":
          description: Whitelisted administrator access required
        "502":
          description: Production API could not provide a snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Production data connection is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/internal/snapshot:
    get:
      operationId: getAdminInternalSnapshot
      tags: [admin]
      summary: Read a production snapshot for a trusted server
      security:
        - AdminSyncToken: []
      parameters:
        - in: query
          name: email
          required: false
          schema:
            type: string
            maxLength: 255
          description: Filter users by email substring
      responses:
        "200":
          description: Production dashboard snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSnapshotResponse"
        "401":
          description: Invalid server-to-server token
        "503":
          description: Server-to-server token is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    AdminSyncToken:
      type: http
      scheme: bearer
      bearerFormat: opaque token
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BpmnGenerateInput:
      type: object
      properties:
        description:
          type: string
          minLength: 1
      required: [description]
    BpmnXmlGenerateInput:
      type: object
      properties:
        textPrompt:
          type: string
          minLength: 1
          maxLength: 60000
      required: [textPrompt]
    BpmnXmlGenerateResponse:
      type: string
    AuthUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        isPremium:
          type: boolean
        hasActivePremium:
          type: boolean
        freeGenerationsLeft:
          type: integer
          minimum: 0
        premiumUntil:
          type: string
          format: date-time
          nullable: true
        isWhitelisted:
          type: boolean
      required: [id, email, isPremium, hasActivePremium, freeGenerationsLeft, premiumUntil, isWhitelisted]
    AuthMeResponse:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          $ref: "#/components/schemas/AuthUser"
      required: [authenticated]
    DocumentUploadInput:
      type: object
      properties:
        file:
          type: string
          format: binary
      required: [file]
    BpmnRefineInput:
      type: object
      properties:
        description:
          type: string
          minLength: 1
        answer:
          type: string
          minLength: 1
        previousValidatorMessage:
          type: string
          description: The latest validator message that provides context for short answers such as "yes" or "add this".
        graph:
          $ref: "#/components/schemas/BpmnGraph"
      required: [description, answer, graph]
    BpmnNode:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [start, end, intermediateEvent, userTask, serviceTask, gateway]
        gatewayType:
          type: string
          enum: [exclusive, parallel]
          description: Gateway semantics for gateway nodes; omitted values default to exclusive.
        eventType:
          type: string
          enum: [catch, throw]
          description: Direction for intermediate events; omitted values default to catch.
        name:
          type: string
      required: [id, type, name]
    BpmnEdge:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
        condition:
          type: string
      required: [from, to]
    BpmnGraph:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/BpmnNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/BpmnEdge"
      required: [nodes, edges]
    BpmnGenerateResponse:
      type: object
      properties:
        graph:
          $ref: "#/components/schemas/BpmnGraph"
      required: [graph]
    DocumentUploadResponse:
      type: object
      properties:
        description:
          type: string
        graph:
          $ref: "#/components/schemas/BpmnGraph"
      required: [description, graph]
    BpmnRefineResponse:
      type: object
      properties:
        graph:
          $ref: "#/components/schemas/BpmnGraph"
        message:
          type: string
      required: [graph, message]
    BpmnSpecInput:
      type: object
      properties:
        graph:
          $ref: "#/components/schemas/BpmnGraph"
        sourceDescription:
          type: string
          description: Original process description, used to match the specification language.
      required: [graph]
    BpmnSpecResponse:
      type: object
      properties:
        spec:
          type: string
      required: [spec]
    AdminStatsResponse:
      type: object
      properties:
        totalUsers:
          type: integer
          minimum: 0
        activePremiumSubscriptions:
          type: integer
          minimum: 0
        totalGenerations:
          type: integer
          minimum: 0
      required: [totalUsers, activePremiumSubscriptions, totalGenerations]
    AdminSnapshotResponse:
      type: object
      properties:
        stats:
          $ref: "#/components/schemas/AdminStatsResponse"
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
      required: [stats, users]
    AdminUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        isPremium:
          type: boolean
        premiumUntil:
          type: string
          format: date-time
          nullable: true
        isWhitelisted:
          type: boolean
        freeGenerationsLeft:
          type: integer
          minimum: 0
      required: [id, email, isPremium, premiumUntil, isWhitelisted, freeGenerationsLeft]
    AdminUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
      required: [users]
    AdminUserResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AdminUser"
      required: [user]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

