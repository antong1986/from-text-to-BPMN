openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: text-to-bpmn
    description: Generate BPMN process graphs and implementation specifications
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /generate:
    post:
      operationId: generateBpmn
      tags: [text-to-bpmn]
      summary: Generate a BPMN graph from a process description
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BpmnGenerateInput"
      responses:
        "200":
          description: Generated process graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BpmnGenerateResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The AI provider returned an error or invalid graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI provider credentials are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bpmn/generate:
    post:
      operationId: generateBpmnXml
      tags: [text-to-bpmn]
      summary: Generate a BPMN 2.0 XML document through OpenRouter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BpmnXmlGenerateInput"
      responses:
        "200":
          description: Raw BPMN 2.0 XML
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/BpmnXmlGenerateResponse"
        "400":
          description: Invalid prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Google sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Free generation limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The model returned invalid BPMN XML
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: OpenRouter is unavailable or credentials are missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      operationId: getAuthStatus
      tags: [health]
      summary: Return the current signed-in user and quota status
      responses:
        "200":
          description: Current authentication status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
  /auth/logout:
    post:
      operationId: logoutUser
      tags: [health]
      summary: End the current login session
      responses:
        "204":
          description: Session ended
  /upload-document:
    post:
      operationId: uploadDocument
      tags: [text-to-bpmn]
      summary: Extract a process description from a document and generate its BPMN graph
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DocumentUploadInput"
      responses:
        "200":
          description: Extracted description and generated process graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentUploadResponse"
        "400":
          description: Unsupported, empty, or unreadable document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Document exceeds the upload size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The AI provider returned an error or invalid graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI provider credentials are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /refine:
    post:
      operationId: refineBpmn
      tags: [text-to-bpmn]
      summary: Apply a clarification to an existing BPMN graph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BpmnRefineInput"
      responses:
        "200":
          description: Updated process graph and validator response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BpmnRefineResponse"
        "400":
          description: Invalid request or incompatible graph update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The clarification did not change the graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The AI provider returned an error or invalid graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI provider credentials are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /generate-spec:
    post:
      operationId: generateSpec
      tags: [text-to-bpmn]
      summary: Generate a technical specification from a BPMN graph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BpmnSpecInput"
      responses:
        "200":
          description: Generated technical specification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BpmnSpecResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The AI provider returned an error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI provider credentials are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BpmnGenerateInput:
      type: object
      properties:
        description:
          type: string
          minLength: 1
      required: [description]
    BpmnXmlGenerateInput:
      type: object
      properties:
        textPrompt:
          type: string
          minLength: 1
          maxLength: 60000
      required: [textPrompt]
    BpmnXmlGenerateResponse:
      type: string
    AuthUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        isPremium:
          type: boolean
        hasActivePremium:
          type: boolean
        freeGenerationsLeft:
          type: integer
          minimum: 0
        premiumUntil:
          type: string
          format: date-time
          nullable: true
        isWhitelisted:
          type: boolean
      required: [id, email, isPremium, hasActivePremium, freeGenerationsLeft, premiumUntil, isWhitelisted]
    AuthMeResponse:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          $ref: "#/components/schemas/AuthUser"
      required: [authenticated]
    DocumentUploadInput:
      type: object
      properties:
        file:
          type: string
          format: binary
      required: [file]
    BpmnRefineInput:
      type: object
      properties:
        description:
          type: string
          minLength: 1
        answer:
          type: string
          minLength: 1
        graph:
          $ref: "#/components/schemas/BpmnGraph"
      required: [description, answer, graph]
    BpmnNode:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [start, end, userTask, serviceTask, gateway]
        name:
          type: string
      required: [id, type, name]
    BpmnEdge:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
        condition:
          type: string
      required: [from, to]
    BpmnGraph:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/BpmnNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/BpmnEdge"
      required: [nodes, edges]
    BpmnGenerateResponse:
      type: object
      properties:
        graph:
          $ref: "#/components/schemas/BpmnGraph"
      required: [graph]
    DocumentUploadResponse:
      type: object
      properties:
        description:
          type: string
        graph:
          $ref: "#/components/schemas/BpmnGraph"
      required: [description, graph]
    BpmnRefineResponse:
      type: object
      properties:
        graph:
          $ref: "#/components/schemas/BpmnGraph"
        message:
          type: string
      required: [graph, message]
    BpmnSpecInput:
      type: object
      properties:
        graph:
          $ref: "#/components/schemas/BpmnGraph"
      required: [graph]
    BpmnSpecResponse:
      type: object
      properties:
        spec:
          type: string
      required: [spec]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

