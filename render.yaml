services:
  - type: web
    name: text-to-bpmn-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: pnpm run build:api
    startCommand: pnpm run start:api
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AI_MODEL_NAME
        value: gemini-3.6-flash
      - key: AI_API_KEY
        sync: false
      - key: ADMIN_SYNC_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://from-text-to-bpmn-api.onrender.com/api/auth/google/callback
      - key: FRONTEND_URL
        value: https://from-text-to-bpmn.vercel.app
      - key: SESSION_COOKIE_SAME_SITE
        value: none
